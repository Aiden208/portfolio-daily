name: Daily Portfolio Report

on:
  push:
    branches: [main]
  schedule:
    # 21:10 北京时间 = 13:10 UTC, 周一至周五 (GitHub 定时可能有几分钟延迟)
    - cron: '10 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run portfolio refresh
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python portfolio_cloud.py

      - name: Commit daily report
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add last_prices.json daily/ index.html
          git diff --cached --quiet || (git commit -m "daily report $(TZ=Asia/Shanghai date +%F)" && git push)
